[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "youo-data-analysis-agent"
version = "0.1.0"
description = "Deterministic, evidence-grounded data analysis agent for YouoAgent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "langgraph>=0.2,<2",
  "langfuse>=4.2,<5",
  "redis>=5,<7",
  "PyMySQL>=1.1,<3",
  "minio>=7.2,<8",
  "pyarrow>=17,<22",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "fakeredis>=2.24,<3"]
entity-extraction = ["gliner>=0.2.21,<0.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.setuptools]
py-modules = ["minio_followup_store"]

[tool.setuptools.packages.find]
include = ["app*"]
